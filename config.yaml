#baseURL: /
baseURL : 'https://changruiraywang.netlify.app/'
languageCode: en-us
#build:
#  writeStats: true
title: ChangruiRayWang
# Uncomment below to use aafu as hugo theme. See instructions in README.md
# theme: aafu

params:
  #author: Darshan Baral
  description: Website title
  copyright: powered by [hugo](https://gohugo.io/)
  theme:
    mainTheme: dark
    showAttribute: true
    singlePage: false
  accordion:
    - item: about_me
      expand: true # only the first `expand: true` will take effect
    #- item: publications
    - item: projects
    - item: skills
      panel_id: skill-panel
    - item: experiences
    - item: education
    #- item: hobbies
  math: true


build:
  buildStats:
    enable: true
  cachebusters:
  - source: 'assets/notwatching/hugo_stats\.json'
    target: css
  - source: '(postcss|tailwind)\.config\.js'
    target: css
module:
  mounts:
  - source: assets
    target: assets
  - disableWatch: true
    source: hugo_stats.json
    target: assets/notwatching/hugo_stats.json
markup:
  goldmark:
    renderer:
      unsafe: true

#relativeURLs: false
#canonifyURLs: true
